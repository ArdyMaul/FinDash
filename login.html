<!DOCTYPE html>
<html lang="en" x-data="{ 
  darkMode: localStorage.getItem('theme') === 'dark',
  email: '',
  password: '',
  error: false,
  toggleTheme() {
    this.darkMode = !this.darkMode;
    localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
    window.dispatchEvent(new CustomEvent('theme-changed', { detail: this.darkMode }));
  },
  login() {
    if (this.email === 'admin@example.com' && this.password === 'password123') {
      window.location.href = 'index.html';
    } else {
      this.error = true;
      setTimeout(() => this.error = false, 3000);
    }
  }
}" :class="{ 'dark': darkMode }">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FinDash Premium Finance</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="./dist/css/style.css" rel="stylesheet">
  
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="transition-colors duration-200 min-h-screen flex items-center justify-center relative overflow-hidden bg-slate-50 dark:bg-navy-900">
  
  <!-- Ambient Background Orbs -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-brand-500/20 blur-[120px]"></div>
    <div class="absolute top-[60%] -right-[10%] w-[40%] h-[60%] rounded-full bg-blue-500/20 blur-[120px]"></div>
  </div>

  <!-- Theme Toggle -->
  <button @click="toggleTheme()" class="absolute top-6 right-6 p-2.5 text-slate-400 hover:text-slate-700 dark:hover:text-white rounded-xl hover:bg-white/50 dark:hover:bg-navy-800 transition-colors z-50 shadow-sm border border-slate-200 dark:border-white/5 backdrop-blur-md">
    <i class="ph text-xl" :class="darkMode ? 'ph-sun' : 'ph-moon'"></i>
  </button>

  <!-- Login Card -->
  <div class="w-full max-w-md p-6 sm:p-10 z-10 relative">
    <div class="glass-card rounded-3xl p-8 shadow-2xl relative overflow-hidden border-slate-200/60 dark:border-white/10">
      
      <!-- Card Decor -->
      <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-brand-400/20 to-blue-500/20 rounded-bl-full blur-2xl"></div>
      
      <div class="text-center mb-8 relative z-10">
        <div class="w-14 h-14 bg-brand-500 rounded-2xl flex items-center justify-center text-white shadow-glow mx-auto mb-4">
          <i class="ph ph-command text-3xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white mb-2">Welcome Back</h1>
        <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Please sign in to your account</p>
      </div>

      <!-- Error Message Alert -->
      <div x-show="error" 
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 -translate-y-2"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100"
           x-transition:leave-end="opacity-0"
           class="mb-6 p-4 bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 rounded-xl flex items-start gap-3" 
           style="display: none;">
        <i class="ph ph-warning-circle text-red-500 text-xl shrink-0 mt-0.5"></i>
        <div>
          <p class="text-sm font-bold text-red-600 dark:text-red-400">Login Failed</p>
          <p class="text-xs font-medium text-red-500 dark:text-red-400/80 mt-1">Invalid email or password. Please try again.</p>
        </div>
      </div>

      <form @submit.prevent="login" class="space-y-5 relative z-10">
        <div>
          <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
          <div class="relative">
            <i class="ph ph-envelope-simple absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
            <input x-model="email" type="email" required placeholder="admin@example.com" class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-navy-900/50 border border-slate-200 dark:border-white/5 rounded-xl font-medium text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white transition-all shadow-inner">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Password</label>
            <a href="#" class="text-xs font-bold text-brand-500 hover:text-brand-600 transition-colors">Forgot?</a>
          </div>
          <div class="relative" x-data="{ show: false }">
            <i class="ph ph-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
            <input x-model="password" :type="show ? 'text' : 'password'" required placeholder="password123" class="w-full pl-11 pr-11 py-3 bg-slate-50 dark:bg-navy-900/50 border border-slate-200 dark:border-white/5 rounded-xl font-medium text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white transition-all shadow-inner">
            <button type="button" @click="show = !show" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">
              <i class="ph text-lg" :class="show ? 'ph-eye-slash' : 'ph-eye'"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-3 cursor-pointer" x-data="{ remember: true }" @click="remember = !remember">
          <div :class="remember ? 'bg-brand-500 border-brand-500 text-white' : 'bg-slate-50 dark:bg-navy-900 border-slate-300 dark:border-slate-600 text-transparent'" class="w-5 h-5 border rounded-md flex items-center justify-center transition-all">
            <i class="ph ph-check text-xs font-bold"></i>
          </div>
          <span class="text-xs font-semibold text-slate-600 dark:text-slate-400 select-none">Remember me for 30 days</span>
        </div>

        <button type="submit" class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl shadow-glow hover:shadow-none hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 mt-2">
          Sign In <i class="ph ph-arrow-right font-bold"></i>
        </button>
      </form>

      <div class="mt-8 text-center relative z-10">
        <p class="text-sm font-medium text-slate-500 dark:text-slate-400">
          Don't have an account? <a href="#" class="font-bold text-brand-500 hover:text-brand-600 transition-colors">Create one</a>
        </p>
      </div>
    </div>

    <!-- Credentials Helper -->
    <div class="mt-8 text-center">
      <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-3">Demo Credentials</p>
      <div class="inline-flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-6 bg-white/50 dark:bg-navy-800/50 backdrop-blur-md border border-slate-200 dark:border-white/10 rounded-xl px-5 py-2.5 text-xs font-medium text-slate-500 dark:text-slate-400 shadow-sm">
        <span>Email: <span class="font-bold text-slate-800 dark:text-slate-200">admin@example.com</span></span>
        <span class="hidden sm:inline">&bull;</span>
        <span>Pass: <span class="font-bold text-slate-800 dark:text-slate-200">password123</span></span>
      </div>
    </div>
  </div>

</body>
</html>
